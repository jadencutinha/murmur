syntax = "proto3";

// All murmur services share one proto package so the generated Rust lands in a
// single `proto` module. Client-facing KV lives here; internal Raft RPCs get
// their own file (added in a later checkpoint) under the same package.
package murmur;

// The client-facing key/value API. A murmur node exposes this; in later
// checkpoints every mutating call is routed through Raft before it touches the
// local Sable engine, but the wire contract stays the same.
service Kv {
  // Hand out a fresh, unique client id. A client calls this once and stamps every
  // subsequent mutation with the id, so the cluster can deduplicate retries.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  // Append `value` to whatever `key` currently holds. Non-idempotent, so it makes
  // exactly-once visible: a retried Append must not double-apply.
  rpc Append(AppendRequest) returns (AppendResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message RegisterRequest {}

message RegisterResponse {
  uint64 client_id = 1;
}

message GetRequest {
  bytes key = 1;
}

message GetResponse {
  // Distinguishes "present with empty value" from "absent" — a bare empty
  // `value` could mean either, so `found` carries the truth.
  bool found = 1;
  bytes value = 2;
}

// Mutating requests carry the caller's `client_id` and a per-client monotonic
// `seq`. A retry reuses the same pair, which is how the cluster recognizes and
// collapses duplicates. Both zero means "unidentified" — applied without dedup.
message PutRequest {
  bytes key = 1;
  bytes value = 2;
  uint64 client_id = 3;
  uint64 seq = 4;
}

message PutResponse {}

message AppendRequest {
  bytes key = 1;
  bytes value = 2;
  uint64 client_id = 3;
  uint64 seq = 4;
}

message AppendResponse {
  bytes value = 1; // the value after appending
}

message DeleteRequest {
  bytes key = 1;
  uint64 client_id = 2;
  uint64 seq = 3;
}

message DeleteResponse {}

// A single KV operation as it travels through the Raft log. The leader encodes
// one of these into a log entry's opaque `command` bytes; every node decodes and
// applies it to its local Sable engine when the entry commits, keeping all
// replicas identical. Reads (`GET`) go through the log too, which makes them
// linearizable at the cost of a consensus round.
enum Op {
  GET = 0;
  PUT = 1;
  DELETE = 2;
  APPEND = 3;
}

message Command {
  Op op = 1;
  bytes key = 2;
  bytes value = 3; // used by PUT/APPEND; empty otherwise
  // Client identity + per-client sequence number, used to deduplicate retried
  // mutations at apply time. Zero means "unidentified" (no dedup).
  uint64 client_id = 4;
  uint64 seq = 5;
  // Per-proposal id assigned by the proposing node, used only to match a
  // committed entry back to the RPC that is blocked waiting for it. Distinct from
  // (client_id, seq): reads and cross-node retries reuse those but each proposal
  // gets its own nonce, so waiters never collide.
  uint64 nonce = 6;
}
