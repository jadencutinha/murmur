syntax = "proto3";

// Same package as kv.proto so both generate into one `proto` module. This is the
// internal, node-to-node consensus API — clients never call it.
package murmur;

// The Raft RPCs exchanged between peers. Clients never call these.
service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  // Bring a follower whose needed entries the leader has already compacted back
  // up to date by shipping the state-machine snapshot directly.
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

// Wire form of a log entry. The entry's index is positional (not carried on the
// wire); only its term and opaque command bytes travel.
message LogEntry {
  uint64 term = 1;
  bytes command = 2;
}

message RequestVoteRequest {
  uint64 term = 1;
  uint64 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  // Fast-backtracking hint (populated at the log-repair checkpoint). proto3 has
  // no optionals here, so `has_conflict` gates whether the two fields are set.
  bool has_conflict = 3;
  uint64 conflict_index = 4;
  uint64 conflict_term = 5;
}

message InstallSnapshotRequest {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  // The whole snapshot in one shot (no chunking at lab scale).
  bytes data = 5;
}

message InstallSnapshotResponse {
  uint64 term = 1;
}
